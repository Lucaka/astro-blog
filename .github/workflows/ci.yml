name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  a11y:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: browser-actions/setup-chrome@v1
        id: chrome
      - run: pnpm install --frozen-lockfile
        env:
          PUPPETEER_SKIP_DOWNLOAD: "true"
      - run: pnpm run build
      - name: Accessibility
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
        run: |
          pnpm exec astro preview --host 127.0.0.1 --port 4321 &
          pid=$!
          ready=0
          for _ in $(seq 1 40); do
            if curl -sf -o /dev/null http://127.0.0.1:4321/; then
              ready=1
              break
            fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then
            echo "preview server did not start"
            kill $pid || true
            exit 1
          fi
          pnpm run a11y
          status=$?
          kill $pid || true
          exit $status
